name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared by every job: the preview shape the app and its checks run under.
env:
  APP_ENV: preview
  SYNTHETIC_DATA_ONLY: "true"
  DATABASE_URL: postgresql://edu_canvas:edu_canvas_dev@127.0.0.1:5432/edu_canvas
  # Test-only value: smoke exercises public HTTP routes and never calls OpenAI.
  OPENAI_API_KEY: ci-test-key
  # Test-only authentication configuration. Preview must use the hosted
  # provider and fails closed without these values, so CI supplies
  # synthetic ones rather than falling back to the local provider.
  AUTH_PROVIDER: supabase
  AUTH_PUBLIC_ORIGIN: http://127.0.0.1:3000
  AUTH_SESSION_SECRET: ci-only-session-secret-that-is-long-enough
  AUTH_CREDENTIAL_KEY: ZWR1LWNhbnZhcy1jaS1rZXktMDAwMDAwMDAwMDAwMDA=
  SUPABASE_URL: https://synthetic-project.supabase.co
  SUPABASE_ANON_KEY: synthetic-anon-key
  SUPABASE_SERVICE_ROLE_KEY: synthetic-service-role-key

jobs:
  # Format, lint, types, and repository rules. No database or build needed.
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Run static checks
        run: pnpm check:static

  # Unit tests run once, with coverage; `pnpm check` runs the same suite
  # without coverage locally.
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Run tests with coverage
        run: pnpm test:coverage

  # Build, database, release image, and smoke tests.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edu_canvas
          POSTGRES_USER: edu_canvas
          POSTGRES_PASSWORD: edu_canvas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edu_canvas -d edu_canvas" --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Check Drizzle schema history
        run: pnpm db:drizzle:check

      - name: Verify migrations match the schema
        run: pnpm db:generate && git diff --exit-code -- drizzle

      - name: Prepare database for integration checks
        run: pnpm db:setup

      - name: Build and check the client bundle
        run: pnpm build && pnpm verify:client-boundary

      - name: Apply and repeat database bootstrap
        run: |
          pnpm db:setup
          pnpm db:migrate
          pnpm db:seed

      - name: Reject an edited applied migration
        run: |
          trap 'git checkout -- drizzle/0001_foundation_behaviors.sql' EXIT
          echo "-- tamper" >> drizzle/0001_foundation_behaviors.sql
          ! node scripts/database-migrate-runtime.mjs

      - name: Run PostgreSQL persistence parity tests
        run: pnpm test:database

      - name: Build and smoke-test the release image
        run: |
          docker build --tag edu-canvas:ci .
          docker run --detach --rm --name edu-canvas-ci \
            --publish 3010:3000 \
            --add-host host.docker.internal:host-gateway \
            --env APP_ENV=preview \
            --env SYNTHETIC_DATA_ONLY=true \
            --env OPENAI_API_KEY=ci-test-key \
            --env DATABASE_URL=postgresql://edu_canvas:edu_canvas_dev@host.docker.internal:5432/edu_canvas \
            --env AUTH_PROVIDER=supabase \
            --env AUTH_PUBLIC_ORIGIN=http://127.0.0.1:3010 \
            --env AUTH_SESSION_SECRET=ci-only-session-secret-that-is-long-enough \
            --env AUTH_CREDENTIAL_KEY=ZWR1LWNhbnZhcy1jaS1rZXktMDAwMDAwMDAwMDAwMDA= \
            --env SUPABASE_URL=https://synthetic-project.supabase.co \
            --env SUPABASE_ANON_KEY=synthetic-anon-key \
            --env SUPABASE_SERVICE_ROLE_KEY=synthetic-service-role-key \
            edu-canvas:ci
          cleanup() {
            docker rm -f edu-canvas-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$(docker inspect --format '{{.Config.User}}' edu-canvas-ci)" = "node"
          docker exec edu-canvas-ci node scripts/database-migrate-runtime.mjs
          docker exec edu-canvas-ci node scripts/database-migrate-runtime.mjs

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3010/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3010/api/readiness
          SMOKE_URL=http://127.0.0.1:3010 pnpm smoke

      - name: Smoke-test the built server
        run: |
          pnpm start > "$RUNNER_TEMP/edu-canvas-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/api/readiness
          pnpm smoke

  # The one required status check. Branch protection names `foundation`, so
  # this job keeps that name and passes only when every job above passed
  # (a skipped or cancelled job fails it too).
  foundation:
    if: always()
    needs: [static, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every foundation job
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.static.result }}" = success
          test "${{ needs.unit.result }}" = success
          test "${{ needs.integration.result }}" = success
