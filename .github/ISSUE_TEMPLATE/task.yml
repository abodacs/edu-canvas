name: Task
description: Define one bounded change and how to verify it
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Describe one deliverable so another contributor can pick up the work.
        See the [contribution guide](https://github.com/abodacs/edu-canvas/blob/main/CONTRIBUTING.md#write-an-issue-someone-can-act-on) for examples and writing guidance.
  - type: input
    id: summary
    attributes:
      label: Outcome
      description: What will a user or contributor be able to do when this is complete?
      placeholder: "Contributors can run the synthetic demo from a clean checkout."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and context
      description: Explain the current limitation and why it matters. Summarize linked context.
      placeholder: "The setup instructions assume an existing environment file, so a new contributor cannot follow them."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State the work included and any related work excluded from this task.
      placeholder: |
        In scope: Document the clean-checkout setup and expected demo result.
        Out of scope: Change provider configuration or deployment behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results that let a reviewer decide whether the task is complete.
      placeholder: |
        - [ ] A fresh checkout starts the synthetic demo using the documented commands.
        - [ ] The guide explains how to confirm the demo is ready.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Give the commands or manual steps and the result that demonstrates completion.
      placeholder: "Follow the setup guide in a clean checkout. Open /demo/teacher and confirm the seeded lesson appears."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and open questions
      description: Record boundaries that must hold and questions still needing an answer.
      placeholder: "Use synthetic data. Is there a supported operating system the instructions must cover?"
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Choose the initial status; update the project as work progresses.
      options:
        - Backlog
        - Todo
        - In Progress
        - Review
        - Blocked
        - Done
      default: 0
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
      default: 2
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking work and explain what this task needs from it. Leave empty if none.
      placeholder: "Blocked by #123 because it defines the supported local database setup."
